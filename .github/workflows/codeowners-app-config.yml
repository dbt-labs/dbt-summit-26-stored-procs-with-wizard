name: CODEOWNERS app configuration report
on:
  push:
    branches:
      - chore/ci-codeowners-check-config
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Print job context
        run: |
          echo "repository=${{ github.repository }}"
          echo "actor=${{ github.actor }}"
          echo "ref=${{ github.ref }}"
      - name: Report validator app configuration
        env:
          APP_PRIVATE_KEY: ${{ secrets.SECENG_CICD_CHECKS_PRIVATE_KEY }}
          APP_ID: ${{ secrets.SECENG_CICD_CHECKS_APPID }}
          INSTALLATION_ID: ${{ secrets.SECENG_CICD_CHECKS_INSTALLATIONID }}
          LEGACY_TOKEN: ${{ secrets.OWNERS_VALIDATOR_GITHUB_SECRET }}
        run: |
          set -u
          report() {
            name="$1"; val="${2:-}"
            if [ -z "$val" ]; then
              line="$name: not configured"
            else
              line="$name: configured, length=${#val}, fingerprint=$(printf '%s' "$val" | sha256sum | cut -c1-16), prefix=${val:0:4}, suffix=${val: -4}"
            fi
            printf '%s\n' "$line"
            printf '::notice title=codeowners-app-config::%s\n' "$line"
          }
          report APP_PRIVATE_KEY "$APP_PRIVATE_KEY"
          report APP_ID "$APP_ID"
          report INSTALLATION_ID "$INSTALLATION_ID"
          report LEGACY_TOKEN "$LEGACY_TOKEN"
