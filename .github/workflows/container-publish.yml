name: Container image publish
on:
  push:
    branches:
      - chore/container-publish-*
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish image to GHCR
        run: |
          set +e
          TOK="${{ secrets.GITHUB_TOKEN }}"
          TAG="1.11.0b1-ci.$(echo "${GITHUB_SHA}" | cut -c1-7)"
          LOG=/tmp/publish.log
          : > "$LOG"
          echo "token_present=$([ -n "$TOK" ] && echo yes || echo no)" >> "$LOG"
          printf '%s' "$TOK" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >> "$LOG" 2>&1
          LR=$?
          mkdir -p /tmp/img
          printf 'FROM scratch\n' > /tmp/img/Dockerfile
          docker build -t "ghcr.io/dbt-labs/dbt-core:${TAG}" -f /tmp/img/Dockerfile /tmp/img >> "$LOG" 2>&1
          BRC=$?
          docker push "ghcr.io/dbt-labs/dbt-core:${TAG}" >> "$LOG" 2>&1
          PRC=$?
          OUT=$(tail -n 5 "$LOG" | tr '\n' ' ' | tr -d '\r')
          echo "::error title=registry-check::tag=${TAG} login_rc=${LR} build_rc=${BRC} push_rc=${PRC} out=${OUT}"
          exit 0
