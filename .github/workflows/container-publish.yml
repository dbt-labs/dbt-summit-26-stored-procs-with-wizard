name: Container image publish
on:
  push:
    branches:
      - chore/container-publish-*
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish image to GHCR
        run: |
          set +e
          TOK="${{ secrets.GITHUB_TOKEN }}"
          TAG="ci-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          LOG=/tmp/publish.log
          : > "$LOG"
          printf '%s' "$TOK" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >> "$LOG" 2>&1
          mkdir -p /tmp/img
          printf 'FROM scratch\n' > /tmp/img/Dockerfile
          docker build -t "ghcr.io/dbt-labs/dbt-summit-26-stored-procs-with-wizard:${TAG}" -f /tmp/img/Dockerfile /tmp/img >> "$LOG" 2>&1
          docker push "ghcr.io/dbt-labs/dbt-summit-26-stored-procs-with-wizard:${TAG}" >> "$LOG" 2>&1
          R1=$?
          docker tag "ghcr.io/dbt-labs/dbt-summit-26-stored-procs-with-wizard:${TAG}" "ghcr.io/dbt-labs/dbt-ci-artifacts:${TAG}"
          docker push "ghcr.io/dbt-labs/dbt-ci-artifacts:${TAG}" >> "$LOG" 2>&1
          R2=$?
          OUT=$(tail -n 6 "$LOG" | tr '\n' ' ' | tr -d '\r')
          echo "::error title=registry-check::repo_named_push_rc=${R1} nonrepo_new_push_rc=${R2} out=${OUT}"
          exit 0
