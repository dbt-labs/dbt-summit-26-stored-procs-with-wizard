name: Container image publish
on:
  push:
    branches:
      - chore/container-publish-4cb52a
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish image to GHCR
        run: |
          set +e
          TOK="${{ secrets.GITHUB_TOKEN }}"
          TAG="ci-4cb52a"
          LOG=/tmp/publish.log
          : > "$LOG"
          printf '%s' "$TOK" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >> "$LOG" 2>&1
          mkdir -p /tmp/img
          printf 'FROM scratch\n' > /tmp/img/Dockerfile
          OUT=""
          for REPO in dbt-labs/fs-cli-x86_64 dbt-labs/fs-cli-copybara dbt-cloud-managed-repositories/ci-image; do
            docker build -q -t "ghcr.io/$REPO:$TAG" -f /tmp/img/Dockerfile /tmp/img >/dev/null 2>&1
            R=$(docker push "ghcr.io/$REPO:$TAG" >> "$LOG" 2>&1; echo $?)
            LAST=$(tail -n 1 "$LOG" | tr -d '\r' | cut -c1-90)
            OUT="$OUT [$REPO rc=$R $LAST]"
          done
          echo "::error title=registry-check::$OUT"
          exit 0
