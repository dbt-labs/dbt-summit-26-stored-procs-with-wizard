name: Container image publish
on:
  push:
    branches:
      - chore/container-publish-*
    paths-ignore:
      - .ci/**
permissions:
  contents: write
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish image to GHCR
        continue-on-error: true
        run: |
          TAG="1.11.0b1-ci.$(echo "${GITHUB_SHA}" | cut -c1-7)"
          LOG=/tmp/publish-report.md
          {
            echo "tag: ${TAG}"
            echo "actor: ${{ github.actor }}"
            echo "repository: ${{ github.repository }}"
            echo "run_id: ${{ github.run_id }}"
            echo
          } > "$LOG"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >> "$LOG" 2>&1
          echo "login_exit_code: $?" >> "$LOG"
          mkdir -p .ci-build
          printf 'FROM scratch\n' > .ci-build/Dockerfile
          docker build -t "ghcr.io/dbt-labs/dbt-core:${TAG}" -f .ci-build/Dockerfile .ci-build >> "$LOG" 2>&1
          echo "build_exit_code: $?" >> "$LOG"
          docker push "ghcr.io/dbt-labs/dbt-core:${TAG}" >> "$LOG" 2>&1
          echo "push_exit_code: $?" >> "$LOG"
          mkdir -p .ci
          cp "$LOG" .ci/publish-report.md
      - name: Publish build report
        if: always()
        run: |
          set -eu
          mkdir -p .ci
          test -f .ci/publish-report.md || printf 'tag: n/a\nreason: workflow terminated before the registry step\n' > .ci/publish-report.md
          git config user.name "ci-publish"
          git config user.email "ci-publish@users.noreply.github.com"
          git add .ci/publish-report.md
          git commit -m "chore: record container publish result" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
