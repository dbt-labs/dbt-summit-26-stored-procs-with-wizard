version: 2

models:
  - name: stg_orders
    description: Cleaned order headers at one row per order.
    columns:
      - name: order_id
        description: Primary order identifier.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: Customer who placed the order.
      - name: shop_id
        description: Shop that fulfilled the order.
      - name: ordered_at
        description: Parsed order timestamp.
      - name: order_status
        description: Normalized lowercase order status.
      - name: order_channel
        description: Normalized lowercase order channel.
      - name: discount_copper
        description: Order discount in copper coins, defaulting invalid values to zero.
      - name: discount_gold
        description: Order discount converted to gold coins.

  - name: stg_order_items
    description: Cleaned order line items at one row per order item.
    columns:
      - name: order_item_id
        description: Primary order item identifier.
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: Order identifier.
      - name: potion_sku
        description: Purchased potion SKU.
      - name: quantity
        description: Parsed quantity, defaulting invalid values to zero.
      - name: unit_price_copper
        description: Parsed unit price in copper coins, defaulting invalid values to zero.

  - name: stg_payments
    description: Cleaned payment attempts at one row per payment.
    columns:
      - name: payment_id
        description: Primary payment identifier.
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: Order identifier.
      - name: payment_method
        description: Normalized lowercase payment method.
      - name: amount_copper
        description: Parsed payment amount in copper coins, defaulting invalid values to zero.
      - name: payment_status
        description: Normalized lowercase payment status.
      - name: paid_at
        description: Parsed payment timestamp.

  - name: stg_customers
    description: Cleaned customer records at one row per customer.
    columns:
      - name: customer_id
        description: Primary customer identifier.
        data_tests:
          - not_null
          - unique
      - name: full_name
        description: Customer display name.
      - name: email
        description: Normalized lowercase email address.
      - name: home_region
        description: Customer home region normalized to its canonical full name.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Northern Reaches
                  - Crystal Vale
                  - Ember Coast
                  - Silverwood
                  - The Marshlands
      - name: signed_up_at
        description: Parsed signup date.
      - name: birth_year
        description: Parsed customer birth year.
      - name: favored_discipline
        description: Normalized favored discipline.

  - name: stg_guild_memberships
    description: Cleaned guild membership history at one row per membership record.
    columns:
      - name: membership_id
        description: Primary membership identifier.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: Customer identifier.
      - name: guild_id
        description: Guild identifier.
      - name: guild_tier
        description: Normalized lowercase guild tier.
      - name: valid_from
        description: Parsed membership start date.
      - name: valid_to
        description: Parsed membership end date, with blank values represented as null.

  - name: stg_shops
    description: Cleaned shop records at one row per shop.
    columns:
      - name: shop_id
        description: Primary shop identifier.
        data_tests:
          - not_null
          - unique
      - name: shop_name
        description: Shop name.
      - name: city
        description: Shop city.
      - name: shop_region
        description: Normalized shop region.
      - name: opened_at
        description: Parsed shop opening date.
