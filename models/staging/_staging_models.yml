version: 2

models:
  - name: stg_orders
    description: Cleaned order headers at one row per order.
    columns:
      - name: order_id
        description: Primary order identifier.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: Customer that placed the order.
      - name: shop_id
        description: Shop associated with the order.
      - name: ordered_at
        description: Parsed order timestamp.
      - name: order_status
        description: Lowercase, trimmed order status.
      - name: order_channel
        description: Lowercase, trimmed sales channel.
      - name: discount_copper
        description: Order discount in copper coins, defaulting invalid or null values to zero.
      - name: discount_gold
        description: Order discount converted to gold coins.

  - name: stg_order_items
    description: Cleaned order line items at one row per order item.
    columns:
      - name: order_item_id
        description: Primary order item identifier.
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: Order containing the line item.
      - name: potion_sku
        description: Potion sold on the line item.
      - name: quantity
        description: Parsed item quantity.
      - name: unit_price_copper
        description: Parsed unit price in copper coins.

  - name: stg_payments
    description: Cleaned payment attempts at one row per payment attempt.
    columns:
      - name: payment_id
        description: Primary payment-attempt identifier.
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: Order associated with the payment attempt.
      - name: method
        description: Raw payment method.
      - name: amount_copper
        description: Parsed attempted payment amount in copper coins.
      - name: payment_status
        description: Lowercase, trimmed payment status.
      - name: paid_at
        description: Parsed payment-attempt timestamp.

  - name: stg_customers
    description: Cleaned customer records at one row per customer.
    columns:
      - name: customer_id
        description: Primary customer identifier.
        data_tests:
          - not_null
          - unique
      - name: full_name
        description: Customer display name.
      - name: email
        description: Lowercase, trimmed customer email.
      - name: home_region
        description: Standardized customer home region.
      - name: signed_up_at
        description: Parsed customer signup date.
      - name: birth_year
        description: Parsed customer birth year.
      - name: favored_discipline
        description: Standardized favored magical discipline.

  - name: stg_guild_memberships
    description: Cleaned guild membership history at one row per membership record.
    columns:
      - name: membership_id
        description: Primary membership identifier and deterministic tie-breaker.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: Customer associated with the membership.
      - name: guild_id
        description: Guild associated with the membership.
      - name: guild_tier
        description: Lowercase, trimmed membership tier.
      - name: valid_from
        description: Parsed membership start date.
      - name: valid_to
        description: Parsed membership end date; blank values become null.

  - name: stg_shops
    description: Cleaned shop locations at one row per shop.
    columns:
      - name: shop_id
        description: Primary shop identifier.
        data_tests:
          - not_null
          - unique
      - name: shop_name
        description: Shop name.
      - name: city
        description: Shop city.
      - name: shop_region
        description: Standardized shop region.
      - name: opened_at
        description: Parsed shop opening date.
