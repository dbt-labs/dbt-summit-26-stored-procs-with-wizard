version: 2

models:
  - name: stg_orders
    description: Cleaned order headers at one row per order_id.
    columns:
      - name: order_id
        description: Primary order identifier.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: Customer that placed the order.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: shop_id
        description: Shop that fulfilled the order.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_shops')
                field: shop_id
      - name: ordered_at
        description: Parsed order timestamp.
      - name: order_status
        description: Lowercased and trimmed order status.
      - name: order_channel
        description: Lowercased and trimmed order channel.
      - name: discount_copper
        description: Cleaned order discount in copper coins.
      - name: discount_gold
        description: Order discount in gold, calculated as copper divided by 100.0.

  - name: stg_order_items
    description: Cleaned order line items at one row per order_item_id.
    columns:
      - name: order_item_id
        description: Primary order line identifier.
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: Parent order identifier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: potion_sku
        description: Ordered potion SKU.
      - name: quantity
        description: Parsed ordered quantity.
      - name: unit_price_copper
        description: Parsed unit price in copper coins.
      - name: unit_price_gold
        description: Unit price in gold, calculated as copper divided by 100.0.

  - name: stg_payments
    description: Cleaned payment attempts at one row per payment_id.
    columns:
      - name: payment_id
        description: Primary payment attempt identifier.
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: Parent order identifier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_method
        description: Lowercased and trimmed payment method.
      - name: amount_copper
        description: Parsed payment attempt amount in copper coins.
      - name: amount_gold
        description: Payment attempt amount in gold, calculated as copper divided by 100.0.
      - name: payment_status
        description: Lowercased and trimmed payment attempt status.
      - name: paid_at
        description: Parsed payment attempt timestamp.

  - name: stg_customers
    description: Cleaned customers at one row per customer_id.
    columns:
      - name: customer_id
        description: Primary customer identifier.
        data_tests:
          - not_null
          - unique
      - name: full_name
        description: Customer display name.
      - name: email
        description: Lowercased and trimmed customer email.
      - name: home_region
        description: Normalized customer home region.
      - name: signed_up_at
        description: Parsed customer signup date.
      - name: birth_year
        description: Parsed customer birth year.
      - name: favored_discipline
        description: Normalized favored discipline.

  - name: stg_shops
    description: Cleaned shop locations at one row per shop_id.
    columns:
      - name: shop_id
        description: Primary shop identifier.
        data_tests:
          - not_null
          - unique
      - name: shop_name
        description: Shop name.
      - name: city
        description: Shop city.
      - name: shop_region
        description: Normalized shop region.
      - name: opened_at
        description: Parsed shop opening date.

  - name: stg_guild_memberships
    description: Cleaned guild membership history at one row per membership_id.
    columns:
      - name: membership_id
        description: Primary membership record identifier.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: Member customer identifier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: guild_id
        description: Guild identifier.
      - name: guild_tier
        description: Lowercased and trimmed membership tier.
      - name: valid_from
        description: Parsed membership start date.
      - name: valid_to
        description: Parsed membership end date; null denotes an open interval.
