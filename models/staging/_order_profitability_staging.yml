version: 2

models:
  - name: stg_orders
    description: One row per non-null raw order header, cleaned and typed for the order profitability pipeline.
    columns:
      - name: order_id
        description: Unique identifier for the order.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Identifier of the customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: shop_id
        description: Identifier of the shop fulfilling the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shops')
                field: shop_id
      - name: ordered_at
        description: Order timestamp parsed as a timestamp without time zone.
      - name: order_status
        description: Lowercased and trimmed order status.
      - name: order_channel
        description: Lowercased and trimmed order channel.
      - name: discount_copper
        description: Order discount in copper coins, defaulted to zero when the raw value is null or invalid.
      - name: discount_gold
        description: Order discount converted from copper coins to gold coins.

  - name: stg_order_items
    description: One row per raw order line item, with numeric quantity and unit price fields prepared for later rollups.
    columns:
      - name: order_item_id
        description: Unique identifier for the source order line item.
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: Identifier of the order containing the line item.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: potion_sku
        description: Identifier of the potion sold on the line item.
      - name: quantity
        description: Ordered quantity parsed as a number and defaulted to zero when invalid.
      - name: unit_price_copper
        description: Unit price in copper coins parsed as a number and defaulted to zero when invalid.

  - name: stg_payments
    description: One row per raw payment attempt, retaining attempt-level detail with cleaned status, amount, and timestamp fields.
    columns:
      - name: payment_id
        description: Unique identifier for the payment attempt.
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: Identifier of the order associated with the payment attempt.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_method
        description: Method used for the payment attempt.
      - name: amount_copper
        description: Payment amount in copper coins parsed as a number and defaulted to zero when invalid.
      - name: payment_status
        description: Lowercased and trimmed payment status.
      - name: paid_at
        description: Payment timestamp parsed as a timestamp without time zone.

  - name: stg_customers
    description: One row per raw customer, with contact, regional, signup, birth year, and discipline fields normalized for downstream joins.
    columns:
      - name: customer_id
        description: Unique identifier for the customer.
        data_tests:
          - unique
          - not_null
      - name: full_name
        description: Customer display name from the source.
      - name: email
        description: Lowercased and trimmed customer email address.
      - name: home_region
        description: Trimmed title-cased home region, with NR expanded to Northern Reaches per the legacy procedure.
      - name: signed_up_at
        description: Customer signup date parsed from the source text.
      - name: birth_year
        description: Customer birth year parsed as a number.
      - name: favored_discipline
        description: Customer favored discipline, trimmed and title-cased.

  - name: stg_guild_memberships
    description: One row per raw guild membership interval; current-record selection is intentionally deferred downstream.
    columns:
      - name: membership_id
        description: Unique source membership identifier retained for deterministic current-record tie-breaking.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Identifier of the customer holding the membership.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: guild_id
        description: Identifier of the guild associated with the membership.
      - name: guild_tier
        description: Lowercased and trimmed membership tier.
      - name: valid_from
        description: Membership validity start date parsed from source text.
      - name: valid_to
        description: Membership validity end date parsed from source text, with blank values represented as null.

  - name: stg_shops
    description: One row per raw shop, with regional and opening-date fields normalized for profitability reporting.
    columns:
      - name: shop_id
        description: Unique identifier for the shop.
        data_tests:
          - unique
          - not_null
      - name: shop_name
        description: Shop display name from the source.
      - name: city
        description: City where the shop operates.
      - name: shop_region
        description: Trimmed and title-cased shop region.
      - name: opened_at
        description: Shop opening date parsed from source text.
