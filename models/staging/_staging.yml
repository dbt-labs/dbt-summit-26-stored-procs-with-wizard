version: 2

models:
  - name: stg_orders
    description: Cleaned order headers at one row per order, excluding records without an order ID.
    columns:
      - name: order_id
        description: Primary order identifier.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: Customer associated with the order.
      - name: shop_id
        description: Shop associated with the order.
      - name: ordered_at
        description: Parsed order timestamp.
      - name: order_status
        description: Lowercased and trimmed order status.
      - name: order_channel
        description: Lowercased and trimmed sales channel.
      - name: discount_copper
        description: Order discount in copper, with malformed or missing values treated as zero for legacy parity.
      - name: discount_gold
        description: Order discount converted from copper at 100 copper per gold.

  - name: stg_order_items
    description: Cleaned order line items at one row per order item.
    columns:
      - name: order_item_id
        description: Primary order-item identifier.
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: Order containing the line item.
      - name: potion_sku
        description: Potion sold on the line item.
      - name: quantity
        description: Parsed ordered quantity.
      - name: unit_price_copper
        description: Parsed unit price in copper.

  - name: stg_payments
    description: Cleaned payment attempts at one row per payment attempt.
    columns:
      - name: payment_id
        description: Primary payment-attempt identifier.
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: Order associated with the payment attempt.
      - name: payment_method
        description: Lowercased and trimmed payment method.
      - name: amount_copper
        description: Parsed payment amount in copper.
      - name: payment_status
        description: Lowercased and trimmed payment status.
      - name: paid_at
        description: Parsed payment-attempt timestamp.

  - name: stg_customers
    description: Cleaned customer records at one row per customer.
    columns:
      - name: customer_id
        description: Primary customer identifier.
        data_tests:
          - not_null
          - unique
      - name: full_name
        description: Customer display name.
      - name: email
        description: Lowercased and trimmed customer email.
      - name: home_region
        description: Standardized customer home region.
      - name: signed_up_at
        description: Parsed customer signup date.
      - name: birth_year
        description: Parsed customer birth year.
      - name: favored_discipline
        description: Customer favored discipline in title case.

  - name: stg_guild_memberships
    description: Cleaned guild membership history at one row per membership record.
    columns:
      - name: membership_id
        description: Primary membership identifier and final deterministic tie-breaker.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: Customer holding the membership.
      - name: guild_id
        description: Guild associated with the membership.
      - name: guild_tier
        description: Lowercased and trimmed membership tier.
      - name: valid_from
        description: Parsed membership start date.
      - name: valid_to
        description: Parsed membership end date; null indicates an open-ended record.

  - name: stg_shops
    description: Cleaned shop records at one row per shop.
    columns:
      - name: shop_id
        description: Primary shop identifier.
        data_tests:
          - not_null
          - unique
      - name: shop_name
        description: Shop name.
      - name: city
        description: Shop city.
      - name: shop_region
        description: Standardized shop region.
      - name: opened_at
        description: Parsed shop opening date.
