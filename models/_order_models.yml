version: 2

models:
  - name: fct_orders
    description: One row per order with customer context, order-item measures, discounts, and payment state.
    config:
      materialized: table
    columns:
      - name: order_id
        description: Primary identifier for the order fact.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: Customer who placed the order.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: customer_name
        description: Customer display name at model build time.
      - name: item_quantity
        description: Total item quantity on the order.
      - name: gross_revenue
        description: Gross line-item revenue in gold coins before discount.
      - name: discount
        description: Order-level discount in gold coins.
      - name: net_revenue
        description: Gross revenue less discount, in gold coins.
      - name: paid_amount
        description: Total successful payment amount in gold coins; null when no payment attempts exist.
      - name: payment_state
        description: Paid when any payment succeeds, cancelled for an unpaid cancelled order, and unpaid otherwise.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - paid
                  - cancelled
                  - unpaid
