version: 2

models:
  - name: time_spine_daily
    description: Daily semantic-layer time spine from 2020-01-01 through 2034-12-31.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: Calendar date at daily grain.
        granularity: day
        data_tests:
          - not_null
          - unique
