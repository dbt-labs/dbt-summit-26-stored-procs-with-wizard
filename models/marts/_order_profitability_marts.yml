version: 2

models:
  - name: fct_order_profitability
    description: One row per order combining customer, current guild membership, shop, item revenue, discounts, and payment outcomes using legacy procedure semantics.
    columns:
      - name: order_id
        description: Unique identifier and grain of the profitability fact.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Identifier of the customer who placed the order.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: customer_name
        description: Customer display name at model build time.
      - name: customer_email
        description: Normalized customer email at model build time.
      - name: home_region
        description: Normalized customer home region at model build time.
      - name: favored_discipline
        description: Normalized favored discipline of the customer.
      - name: guild_id
        description: Guild identifier from the customer's current membership under the legacy selection rule.
      - name: guild_tier
        description: Guild tier from the customer's current membership under the legacy selection rule.
      - name: shop_id
        description: Identifier of the shop fulfilling the order.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_shops')
                field: shop_id
      - name: shop_name
        description: Display name of the fulfilling shop.
      - name: shop_city
        description: City of the fulfilling shop.
      - name: shop_region
        description: Normalized region of the fulfilling shop.
      - name: ordered_at
        description: Parsed timestamp when the order was placed.
      - name: ordered_date
        description: Calendar date derived from ordered_at.
      - name: order_status
        description: Normalized order status.
      - name: order_channel
        description: Normalized channel through which the order was placed.
      - name: item_quantity
        description: Total normalized item quantity on the order; null when no item rollup exists.
      - name: line_count
        description: Count of order-item rows; null when no item rollup exists.
      - name: distinct_potions
        description: Count of distinct potion SKUs; null when no item rollup exists.
      - name: gross_revenue_copper
        description: Gross line-item revenue in copper coins; null when no item rollup exists.
      - name: gross_revenue_gold
        description: Gross line-item revenue in gold coins; null when no item rollup exists.
      - name: discount_copper
        description: Order-level discount in copper coins.
      - name: discount_gold
        description: Order-level discount in gold coins.
      - name: net_revenue_copper
        description: Gross revenue less discount in copper coins, preserving legacy null behavior.
      - name: net_revenue_gold
        description: Gross revenue less discount in gold coins, preserving legacy null behavior.
      - name: paid_amount_copper
        description: Total successful payment amount in copper coins; null when no payment rollup exists.
      - name: paid_amount_gold
        description: Total successful payment amount in gold coins; null when no payment rollup exists.
      - name: latest_paid_at
        description: Latest payment-attempt timestamp for the order.
      - name: payment_attempt_count
        description: Count of payment attempts; null when no payment rollup exists.
      - name: payment_state
        description: Paid when any payment succeeds, otherwise cancelled for cancelled orders, otherwise unpaid.
        data_tests:
          - accepted_values:
              arguments:
                values: ['paid', 'cancelled', 'unpaid']
      - name: is_home_region_order
        description: True when the customer's normalized home region equals the shop's normalized region.
      - name: loaded_at
        description: Timestamp when dbt built the fact table; expected to differ from historical procedure-run timestamps.
