version: 2

models:
  - name: fct_order_profitability
    description: Order profitability fact at one row per order_id, preserving the output contract and business rules of sp_load_order_profitability.
    config:
      materialized: table
    columns:
      - name: order_id
        description: Primary order identifier and fact grain.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: customer_id
        description: Customer that placed the order.
      - name: customer_name
        description: Customer display name at model build time.
      - name: customer_email
        description: Normalized customer email at model build time.
      - name: home_region
        description: Standardized customer home region.
      - name: favored_discipline
        description: Customer favored magical discipline.
      - name: guild_id
        description: Guild from the selected current membership.
      - name: guild_tier
        description: Tier from the selected current membership.
      - name: shop_id
        description: Shop that received the order.
      - name: shop_name
        description: Shop display name.
      - name: shop_city
        description: City containing the shop.
      - name: shop_region
        description: Standardized shop region.
      - name: ordered_at
        description: Parsed order timestamp.
      - name: ordered_date
        description: Calendar date of the order.
      - name: order_status
        description: Normalized order status.
      - name: order_channel
        description: Normalized order channel.
      - name: item_quantity
        description: Total quantity across order lines.
      - name: line_count
        description: Number of order lines.
      - name: distinct_potions
        description: Number of distinct potion SKUs.
      - name: gross_revenue_copper
        description: Gross line revenue in copper coins before discount.
      - name: gross_revenue_gold
        description: Gross line revenue converted to gold.
      - name: discount_copper
        description: Order discount in copper coins.
      - name: discount_gold
        description: Order discount converted to gold.
      - name: net_revenue_copper
        description: Gross revenue less discount in copper coins.
      - name: net_revenue_gold
        description: Gross revenue less discount in gold.
      - name: paid_amount_copper
        description: Successful payment amount in copper coins.
      - name: paid_amount_gold
        description: Successful payment amount converted to gold.
      - name: latest_paid_at
        description: Latest timestamp across all payment attempts.
      - name: payment_attempt_count
        description: Number of payment attempts.
      - name: payment_state
        description: Paid when any successful payment exists, otherwise cancelled for cancelled orders, otherwise unpaid.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['paid', 'cancelled', 'unpaid']
      - name: is_home_region_order
        description: True when the normalized customer and shop regions match.
        data_tests:
          - not_null
      - name: loaded_at
        description: Timestamp when dbt built the fact; excluded from procedure parity comparisons.
        data_tests:
          - not_null
