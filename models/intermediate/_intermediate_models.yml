version: 2

models:
  - name: int_order_item_rollup
    description: Order-item measures rolled up to one row per order_id.
    columns:
      - name: order_id
        description: Primary order identifier for the rollup.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: item_quantity
        description: Total item quantity on the order, treating invalid quantities as zero.
      - name: gross_revenue_copper
        description: Gross line revenue in copper coins before order discount.
      - name: gross_revenue_gold
        description: Gross line revenue converted to gold.
      - name: line_count
        description: Number of order-item rows.
      - name: distinct_potions
        description: Number of distinct potion SKUs on the order.

  - name: int_payments_rollup
    description: Payment attempts rolled up to one row per order_id; only successful attempts contribute to paid amounts.
    columns:
      - name: order_id
        description: Primary order identifier for the rollup.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: paid_amount_copper
        description: Total successful payment amount in copper coins.
      - name: paid_amount_gold
        description: Total successful payment amount converted to gold.
      - name: latest_paid_at
        description: Latest timestamp across all payment attempts, preserving legacy behavior.
      - name: has_successful_payment
        description: Integer flag indicating whether any successful attempt exists.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: payment_attempt_count
        description: Number of payment attempts for the order.

  - name: int_memberships_current
    description: Single selected guild membership per customer, ordered by latest valid_to, valid_from, and membership_id.
    columns:
      - name: customer_id
        description: Primary customer identifier for the selected membership.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: guild_id
        description: Guild on the selected membership.
      - name: guild_tier
        description: Tier on the selected membership.
      - name: valid_from
        description: Start date of the selected membership.
      - name: valid_to
        description: End date of the selected membership.
