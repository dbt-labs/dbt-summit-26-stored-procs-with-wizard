version: 2

models:
  - name: int_order_item_rollup
    description: Order item measures aggregated to one row per order.
    columns:
      - name: order_id
        description: Primary order identifier for the rollup.
        data_tests:
          - not_null
          - unique
      - name: item_quantity
        description: Total quantity across all order lines.
      - name: gross_revenue_copper
        description: Gross item revenue in copper coins before discounts.
      - name: gross_revenue_gold
        description: Gross item revenue converted to gold coins before discounts.
      - name: line_count
        description: Number of order item rows.
      - name: distinct_potions
        description: Number of distinct potion SKUs.

  - name: int_payments_rollup
    description: Payment attempts aggregated to one row per order, with paid amounts limited to successful attempts.
    columns:
      - name: order_id
        description: Primary order identifier for the rollup.
        data_tests:
          - not_null
          - unique
      - name: paid_amount_copper
        description: Total successful payment amount in copper coins.
      - name: paid_amount_gold
        description: Total successful payment amount converted to gold coins.
      - name: latest_paid_at
        description: Latest timestamp across all payment attempts.
      - name: has_successful_payment
        description: Integer flag indicating whether any payment succeeded.
      - name: payment_attempt_count
        description: Number of payment attempts for the order.

  - name: int_memberships_current
    description: Current guild membership selected per customer using the legacy deterministic ranking rule.
    columns:
      - name: customer_id
        description: Primary customer identifier for the current membership record.
        data_tests:
          - not_null
          - unique
      - name: guild_id
        description: Selected current guild.
      - name: guild_tier
        description: Selected current guild tier.
      - name: valid_from
        description: Start date of the selected membership.
      - name: valid_to
        description: End date of the selected membership; null means open-ended.

unit_tests:
  - name: int_memberships_current_selects_open_ended_and_breaks_date_ties
    description: Open-ended memberships rank first, and membership_id breaks ties when dates match.
    model: int_memberships_current
    given:
      - input: ref('stg_guild_memberships')
        rows:
          - {membership_id: MEM-001, customer_id: CUST-1, guild_id: GUILD-OLD, guild_tier: adept, valid_from: '2024-01-01', valid_to: '2025-01-01'}
          - {membership_id: MEM-002, customer_id: CUST-1, guild_id: GUILD-OPEN, guild_tier: archmage, valid_from: '2023-01-01', valid_to: null}
          - {membership_id: MEM-010, customer_id: CUST-2, guild_id: GUILD-LOW, guild_tier: apprentice, valid_from: '2024-06-01', valid_to: '2025-06-01'}
          - {membership_id: MEM-011, customer_id: CUST-2, guild_id: GUILD-HIGH, guild_tier: adept, valid_from: '2024-06-01', valid_to: '2025-06-01'}
    expect:
      rows:
        - {customer_id: CUST-1, guild_id: GUILD-OPEN, guild_tier: archmage, valid_from: '2023-01-01', valid_to: null}
        - {customer_id: CUST-2, guild_id: GUILD-HIGH, guild_tier: adept, valid_from: '2024-06-01', valid_to: '2025-06-01'}
