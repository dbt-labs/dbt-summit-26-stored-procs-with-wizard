version: 2

models:
  - name: int_order_item_rollup
    description: Order item activity aggregated to one row per order.
    columns:
      - name: order_id
        description: Primary order identifier for the rollup.
        data_tests:
          - not_null
          - unique
      - name: item_quantity
        description: Total item quantity across order lines.
      - name: gross_revenue_copper
        description: Gross order revenue in copper coins before discounts.
      - name: gross_revenue_gold
        description: Gross order revenue converted to gold coins before discounts.
      - name: line_count
        description: Number of order lines.
      - name: distinct_potions
        description: Number of distinct potion SKUs in the order.

  - name: int_payments_rollup
    description: Payment attempts aggregated to one row per order.
    columns:
      - name: order_id
        description: Primary order identifier for the rollup.
        data_tests:
          - not_null
          - unique
      - name: paid_amount_copper
        description: Total successful payment amount in copper coins.
      - name: paid_amount_gold
        description: Total successful payment amount converted to gold coins.
      - name: latest_paid_at
        description: Latest timestamp across the order's payment attempts.
      - name: has_successful_payment
        description: Integer flag indicating whether any payment attempt succeeded.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: payment_attempt_count
        description: Number of payment attempts for the order.

  - name: int_memberships_current
    description: Latest guild membership per customer using the legacy valid-to, valid-from, and membership-id tie-break rule.
    columns:
      - name: customer_id
        description: Primary customer identifier for the current membership record.
        data_tests:
          - not_null
          - unique
      - name: guild_id
        description: Current guild identifier.
      - name: guild_tier
        description: Current normalized guild tier.
      - name: valid_from
        description: Current membership start date.
      - name: valid_to
        description: Current membership end date, if closed.
