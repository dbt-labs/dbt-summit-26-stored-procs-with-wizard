version: 2

models:
  - name: int_order_item_rollup
    description: >
      Order line items rolled up to order grain (one row per order_id).
      Sums quantity and gross revenue (copper and gold), and counts lines
      and distinct potions per order, matching the legacy
      tmp_order_item_rollup step.
    columns:
      - name: order_id
        description: Order identifier.
        data_tests:
          - not_null
          - unique
      - name: item_quantity
        description: Total ordered quantity across all line items on the order.
      - name: gross_revenue_copper
        description: Total gross revenue in copper coins across all line items.
      - name: gross_revenue_gold
        description: Total gross revenue in gold coins across all line items.
      - name: line_count
        description: Number of order line items on the order.
      - name: distinct_potions
        description: Count of distinct potion SKUs on the order.

  - name: int_payments_rollup
    description: >
      Payment attempts rolled up to order grain (one row per order_id).
      Sums successful payment amounts only, captures the latest paid
      timestamp, and flags whether the order has any successful payment,
      matching the legacy tmp_payments_rollup step.
    columns:
      - name: order_id
        description: Order identifier.
        data_tests:
          - not_null
          - unique
      - name: paid_amount_copper
        description: Sum of successful payment amounts in copper coins.
      - name: paid_amount_gold
        description: Sum of successful payment amounts in gold coins.
      - name: latest_paid_at
        description: Most recent payment timestamp across all attempts.
      - name: has_successful_payment
        description: 1 if the order has at least one successful payment, else 0.
      - name: payment_attempt_count
        description: Total number of payment attempts on the order, regardless of outcome.

  - name: int_memberships_current
    description: >
      Guild membership history deduped to one current record per customer_id.
      Selects the latest valid membership using the same tie-break rule as
      the legacy tmp_membership_current step (open-ended valid_to sorts
      last, then latest valid_from, then highest membership_id).
    columns:
      - name: customer_id
        description: Customer identifier.
        data_tests:
          - not_null
          - unique
      - name: guild_id
        description: Guild identifier of the customer's current membership.
      - name: guild_tier
        description: Normalized tier of the customer's current membership.
      - name: valid_from
        description: Start date of the customer's current membership.
      - name: valid_to
        description: >
          End date of the customer's current membership. Null indicates an
          open-ended, currently valid membership.
